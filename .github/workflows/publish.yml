name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Renderizar site Quarto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R (para chunks R com freeze:auto)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Cache de pacotes R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Instalar pacotes R necessários
        shell: Rscript {0}
        run: |
          pkgs <- c("ggplot2", "dplyr", "broom", "knitr", "scales")
          install.packages(pkgs, repos = "https://cloud.r-project.org")

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Renderizar site Quarto
        run: quarto render
        env:
          QUARTO_PRINT_STACK: true

      - name: Carregar artefato de páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
